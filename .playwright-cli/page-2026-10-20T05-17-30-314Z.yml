              - cell "0.577 in" [ref=f1e245]
        - paragraph [ref=f1e246]: "Example: the true offset is 15 inches and you bend at 30 degrees. The bends go 30 inches apart. The shrink is about 4 inches. The \"offset direction\" line in the tool tells you how far to rotate the conduit between the two bends, measured from the rise direction."
        - heading "Tips for a clean job" [level=2] [ref=f1e247]
        - list [ref=f1e248]:
          - listitem [ref=f1e249]: Measure to the center of the pipe, not to the edge. For conduit, measure to the center of the tube.
          - listitem [ref=f1e250]: Use the same fitting angle on both ends of the offset.
          - listitem [ref=f1e251]: Check the take-off against the fittings in your hand. Sizes differ between makers.
          - listitem [ref=f1e252]: Dry fit the piece before you glue, solder or weld.
          - listitem [ref=f1e253]: If the cut length comes out zero or negative, the fittings are too large for that offset. Use a smaller angle or a longer rise and roll.
