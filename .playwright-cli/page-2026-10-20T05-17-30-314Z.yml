        - heading "Rolling offset in EMT conduit" [level=2] [ref=f1e215]
        - paragraph [ref=f1e216]: Conduit is bent, not fitted, so the rules change a little. The bender angle sets two numbers. The multiplier is one divided by the sine of the angle. Multiply the true offset by it to get the distance between the two bends. Shrink is the length the conduit loses when you bend it. It equals the true offset times the tangent of half the angle.
        - table [ref=f1e218]:
          - caption [ref=f1e219]: Multiplier and shrink per inch of offset by bend angle
          - rowgroup [ref=f1e220]:
            - row [ref=f1e221]:
              - columnheader "Bend angle" [ref=f1e222]
              - columnheader "Multiplier" [ref=f1e223]
              - columnheader "Shrink per inch of offset" [ref=f1e224]
          - rowgroup [ref=f1e225]:
            - row [ref=f1e226]:
              - cell "10°" [ref=f1e227]
