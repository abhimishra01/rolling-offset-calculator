    - region [ref=f1e134]:
      - article [ref=f1e135]:
        - heading "What is a rolling offset?" [level=2] [ref=f1e136]
        - paragraph [ref=f1e137]: "A rolling offset moves a run of pipe or conduit up and sideways at the same time. The run ends on a new line that is parallel to the old one. You need it when a beam, a duct, a wall or another pipe is in the way and the path is not flat or square. This rolling offset calculator gives you every number you need to lay it out: the true offset, the travel, the run and the cut length."
        - heading "What each number means" [level=2] [ref=f1e138]
        - list [ref=f1e139]:
          - listitem [ref=f1e140]:
            - strong [ref=f1e141]: Rise
            - text: is the vertical distance between the two center lines.
          - listitem [ref=f1e142]:
            - strong [ref=f1e143]: Roll
            - text: is the sideways distance between the two center lines.
          - listitem [ref=f1e144]:
            - strong [ref=f1e145]: True offset
            - text: (the set) is the straight distance between the center lines. It is the diagonal across the rise and the roll.
          - listitem [ref=f1e146]:
            - strong [ref=f1e147]: Travel
            - text: is the center to center length of the angled piece between the two fittings.
          - listitem [ref=f1e148]:
            - strong [ref=f1e149]: Run
            - text: is how far the offset moves along the pipe. It is the length the offset uses up on the straight line.
        - heading "How to use the calculator" [level=2] [ref=f1e150]
        - list [ref=f1e151]:
          - listitem [ref=f1e152]: Measure the rise and the roll from center line to center line, in inches.
          - listitem [ref=f1e153]: Type them in. Use decimals such as 12.5, or fractions such as 12 1/2. The fraction buttons add 1/8 inch steps on a phone.
          - listitem [ref=f1e154]: "Pick the fitting angle: 22.5, 45 or 60 degrees, or type your own."
          - listitem [ref=f1e155]: For pipe, pick the pipe type and size to subtract the fitting take-off. The tool then shows the cut length.
          - listitem [ref=f1e156]: For EMT, switch to conduit mode and pick the bend angle. The tool shows the distance between bends and the shrink.
        - heading "Which fitting angle should you use?" [level=2] [ref=f1e157]
        - paragraph [ref=f1e158]: Most plumbers use 45 degree fittings. They are easy to stock, and they keep the offset short. A 22.5 degree fitting makes a long, gentle offset that is good for drain lines. A 60 degree fitting makes a short, steep offset when space is tight, but it slows the flow more. A smaller angle always makes a longer travel for the same offset. Try each angle in the tool and compare the run.
        - heading "The formulas" [level=2] [ref=f1e159]
        - paragraph [ref=f1e160]: The math is right-triangle geometry. These are the steps the calculator follows.
        - list [ref=f1e161]:
          - listitem [ref=f1e162]: True offset = the square root of (rise squared + roll squared)
          - listitem [ref=f1e163]: Travel = true offset / sin(angle)
          - listitem [ref=f1e164]: Run = true offset / tan(angle)
          - listitem [ref=f1e165]: Cut length = travel - 2 x take-off
        - heading "Worked example" [level=2] [ref=f1e166]
        - paragraph [ref=f1e167]: A copper line must clear a duct. The rise is 12 inches and the roll is 9 inches. You use 45 degree fittings.
        - list [ref=f1e168]:
          - listitem [ref=f1e169]: True offset = the square root of (144 + 81) = 15 inches.
          - listitem [ref=f1e170]: Travel = 15 / sin 45 = 21.21 inches, or about 21 3/16 inches.
          - listitem [ref=f1e171]: Run = 15 / tan 45 = 15 inches.
          - listitem [ref=f1e172]: The 3/4 inch copper fitting has a take-off of about 3/8 inch. Cut length = 21.21 - 0.75 = 20.46 inches, or about 20 7/16 inches.
        - heading "Common rise and roll values" [level=2] [ref=f1e173]
        - paragraph [ref=f1e174]: These pairs give a whole number for the true offset. The travel is for 45 degree fittings.
        - table [ref=f1e176]:
          - caption [ref=f1e177]: True offset and travel for common rise and roll pairs at 45 degrees
