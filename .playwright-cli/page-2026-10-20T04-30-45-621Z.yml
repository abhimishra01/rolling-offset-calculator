    - generic [ref=f14e16]:
      - heading "Privacy Policy" [level=1] [ref=f14e17]
      - generic [ref=f14e18]:
        - paragraph [ref=f14e19]: "Last updated: October 20, 2026"
        - paragraph [ref=f14e20]: This policy explains what Demo Ruler (demoruler.com) collects and why.
        - heading "What the tool does with your input" [level=2] [ref=f14e21]
        - paragraph [ref=f14e22]: The tool runs in your browser. We do not send what you type or upload to our servers.
        - heading "Information we collect" [level=2] [ref=f14e23]
        - paragraph [ref=f14e24]: We do not ask you to create an account. We do not collect names or email addresses, unless you email us. If you do, we use your address only to reply.
        - heading "Cookies and Google Analytics" [level=2] [ref=f14e25]
        - paragraph [ref=f14e26]:
          - text: We may use Google Analytics to count visits and see which pages people use. Google Analytics sets cookies and collects data such as your IP address, browser, device and pages viewed. We use this data in aggregate to improve the site. Learn how Google uses data in its
          - link "\"How Google uses information from sites or apps that use our services\"" [ref=f14e27] [cursor=pointer]:
            - /url: https://policies.google.com/technologies/partner-sites
          - text: page. You can block the tracking with the
          - link "Google Analytics opt-out add-on" [ref=f14e28] [cursor=pointer]:
            - /url: https://tools.google.com/dlpage/gaoptout
          - text: .
        - heading "Advertising and third-party vendors" [level=2] [ref=f14e29]
        - paragraph [ref=f14e30]: We may show ads from Google AdSense and other third-party vendors. Third-party vendors, including Google, use cookies to serve ads based on your earlier visits to this and other websites. Google's use of advertising cookies lets it and its partners serve ads to you based on your visit to our site and other sites on the internet.
        - paragraph [ref=f14e31]:
          - text: You can opt out of personalised advertising in
          - link "Google Ads Settings" [ref=f14e32] [cursor=pointer]:
            - /url: https://adssettings.google.com
          - text: . You can also visit
          - link "aboutads.info" [ref=f14e33] [cursor=pointer]:
            - /url: https://www.aboutads.info
          - text: to opt out of some third-party vendors' use of cookies for personalised advertising.
        - paragraph [ref=f14e34]: Where the law requires it, we ask for your consent before we use cookies for ads or analytics. You can change your choice in your browser settings or by clearing cookies.
        - heading "Your browser's local storage" [level=2] [ref=f14e35]
        - paragraph [ref=f14e36]: The site saves your light or dark theme choice in your browser. This stays on your device.
        - heading "Children" [level=2] [ref=f14e37]
        - paragraph [ref=f14e38]: The site is not aimed at children under 13. We do not knowingly collect their data.
        - heading "Your rights" [level=2] [ref=f14e39]
        - paragraph [ref=f14e40]:
          - text: Depending on where you live, you may have the right to ask what data we hold, and to ask us to correct or delete it. Write to
          - link "hello@demoruler.com" [ref=f14e41] [cursor=pointer]:
            - /url: mailto:hello@demoruler.com
          - text: .
        - heading "Changes" [level=2] [ref=f14e42]
        - paragraph [ref=f14e43]: We may update this policy. The date above shows the latest update.
